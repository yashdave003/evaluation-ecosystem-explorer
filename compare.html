<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare — AI Evaluation Ecosystem Explorer</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Inter", system-ui, sans-serif; background: #f0e6d3; color: #2a1a0e; min-height: 100vh; }

#hdr { position: sticky; top: 0; z-index: 20; background: #e8d9c2;
  border-bottom: 1px solid #c8b498; padding: 0 24px; height: 52px;
  display: flex; align-items: center; gap: 14px; }
#hdr-back { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: #a08868; text-decoration: none; border: 1px solid #c8b498; border-radius: 4px;
  padding: 3px 10px; white-space: nowrap; }
#hdr-back:hover { color: #2a1a0e; border-color: #a08868; }
#hdr-title { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
#hdr-sub { font-size: 11px; color: #a08868; border-left: 1px solid #c8b498; padding-left: 14px; }

#meta-bar { padding: 8px 24px; background: #ede0ca; border-bottom: 1px solid #c8b498;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.meta-chip { font-size: 9px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 10px; border: 1px solid; }
.meta-info { font-size: 10px; color: #7a6045; margin-left: auto; }

#charts-wrap { padding: 14px 24px 0; display: flex; flex-direction: column; gap: 2px; }
.cpanel-lbl { font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: #a08868; margin-bottom: 3px; }
.cpanel svg { width: 100%; display: block; overflow: visible; }

.now-line { pointer-events: none; }
.band { pointer-events: none; }
.sline { pointer-events: none; }
.axis text { fill: #a08868; font-size: 8px; font-family: inherit; }
.axis .domain { stroke: #c8b498; }
.axis .tick line { stroke: #d8c9b0; stroke-dasharray: 2,3; }
.anno-lbl { font-size: 9px; font-family: inherit; pointer-events: none; }

#scrubber-wrap { padding: 10px 24px 0; display: flex; align-items: center; gap: 10px; }
.sbtn { background: #d8c9b0; border: 1px solid #c0ad94; color: #5a4030; width: 28px; height: 28px;
  border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 11px; }
.sbtn:hover { background: #c8b89a; }
#round-lbl { font-size: 11px; font-weight: 700; color: #2a1a0e; min-width: 70px; }
#scrubber { flex: 1; accent-color: #3d5a8a; height: 4px; }

#anno-bar { padding: 12px 24px 20px; display: flex; flex-wrap: wrap; gap: 14px; border-top: 1px solid #d0c0a8; margin-top: 10px; }
.anno-row { display: flex; align-items: center; gap: 7px; }
.anno-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.anno-label { font-size: 10px; font-weight: 600; color: #2a1a0e; min-width: 80px; }
.anno-vals { font-size: 10px; color: #5a4030; display: flex; gap: 14px; }
.anno-val { display: flex; flex-direction: column; gap: 1px; }
.anno-val-key { font-size: 8px; letter-spacing: .07em; text-transform: uppercase; color: #a08868; }
.anno-val-num { font-weight: 600; }

#loading-msg { padding: 48px 24px; text-align: center; font-size: 12px; color: #a08868; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="hdr">
  <a id="hdr-back" href="index.html">← Explorer</a>
  <div id="hdr-title">Compare</div>
  <div id="hdr-sub"></div>
</div>
<div id="meta-bar"></div>
<div id="loading-msg">Loading data…</div>
<div id="charts-wrap" class="hidden">
  <div class="cpanel"><div class="cpanel-lbl">Market Leader Share</div><svg id="svg-shares" height="130"></svg></div>
  <div class="cpanel"><div class="cpanel-lbl">Avg Score–Satisfaction Gap</div><svg id="svg-gap" height="130"></svg></div>
</div>
<div id="scrubber-wrap" class="hidden">
  <button class="sbtn" id="btn-prev">&#9664;</button>
  <span id="round-lbl">Round 0</span>
  <input type="range" id="scrubber" min="0" value="0" step="1">
  <button class="sbtn" id="btn-next">&#9654;&#9474;</button>
</div>
<div id="anno-bar" class="hidden"></div>

<script type="module">
/* ---- Constants ---- */
const CONDITION_COLORS = {
  baseline:"#3d5a8a", public_only:"#4a7a3a", private_only:"#7a3a4a",
  private_dominant:"#8a5a2a", iid_holdout:"#5a3a8a", no_incidents:"#3a7a6a",
  no_funders:"#7a6a2a", no_regulator:"#8a3a2a", no_media:"#4a5a6a",
  no_opensource:"#6a5a3a", homogeneous_consumers:"#4a6a3a",
  initial_uniform_capability:"#6a3a7a", evaluator_capture:"#8a4a2a",
  ev1_deepseek_shock:"#2a7a5a", s5_aligned_private_only:"#7a3a5a",
  s5_aligned_public_only:"#3a7a4a", s8_agentic_private_only:"#5a3a6a",
  s8_agentic_public_only:"#3a5a6a",
  public_only__initial_uniform_capability:"#5a5a8a",
};
const MODEL_LABELS = {
  "claude-sonnet-4-6":"Sonnet 4.6","claude-opus-4-6":"Opus 4.6",
  "gpt-5.5-2026-04-23":"GPT-5.5",
};
const PANEL_H   = 130;
const MARGIN    = { top: 10, right: 140, bottom: 24, left: 44 };
const GREY_LINE = "rgba(100,80,60,0.18)";
const VAR_ANNO_KEYS = [{key:"p10",lbl:"p10"},{key:"median",lbl:"med"},{key:"p90",lbl:"p90"}];

function condColor(c) { return CONDITION_COLORS[c] || "#8a8a8a"; }
function modelLabel(m) { return m ? (MODEL_LABELS[m] || m) : "Heuristic"; }
function fmtCond(c) { return c.replace(/__/g," · ").replace(/_/g," "); }
function pct(v)  { return (v*100).toFixed(1)+"%"; }
function dec3(v) { return v.toFixed(3); }

/* ---- Metric functions (per frame) ---- */
const METRICS = [
  {
    id:"shares", label:"Market Leader Share",
    fn: (f) => Math.max(...Object.values(f.shares || {})),
    fmt: pct, domain: [0, 1],
  },
  {
    id:"gap", label:"Avg Score–Satisfaction Gap",
    fn: (f, provs) => {
      if (!provs || !provs.length) return 0;
      const sum = provs.reduce((s,p) => s + Math.abs((f.scores[p]||0)-(f.sat[p]||0)), 0);
      return sum / provs.length;
    },
    fmt: dec3, domain: null, // computed from data
  },
];

/* ---- URL params ---- */
const params = new URLSearchParams(location.search);
const mode   = params.get("mode") || "variance";

/* ---- Load index ---- */
const runsIndex = await fetch("runs.json").then(r => r.json());

/* ---- Build series list ---- */
// series: [{label, color, frames, providers, lineWidth, lineOpacity, isHighlight, isP10, isP90}]
let series = [];
let pageTitle = "", pageSub = "";
let nRounds = 40;
let varBands = null; // for mode=variance: [{p10,p25,median,p75,p90}] per round per metric

if (mode === "variance") {
  const cond    = params.get("condition") || "baseline";
  const model   = params.get("model")     || "claude-sonnet-4-6";
  const isHeur  = model === "heuristic";

  const matchRuns = runsIndex.filter(r =>
    r.condition === cond &&
    (isHeur ? r.mode === "heuristic" : r.model === model)
  );

  if (!matchRuns.length) {
    document.getElementById("loading-msg").textContent =
      `No runs found for condition="${cond}" model="${model}"`;
    throw new Error("no runs");
  }

  document.getElementById("loading-msg").textContent =
    `Loading ${matchRuns.length} runs…`;

  const sims = await Promise.all(
    matchRuns.map(r => fetch("data/"+r.path+"/frames.json").then(res => res.json()))
  );

  nRounds = sims[0].frames.length;
  const providers = sims[0].providers;

  // Pick p10/p90 by final leader share
  const finals = sims.map(s => Math.max(...Object.values(s.frames[nRounds-1].shares)));
  const ranked = finals.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v);
  const n = ranked.length;
  const p10i = ranked[Math.max(0, Math.floor(n*0.1))].i;
  const p90i = ranked[Math.min(n-1, Math.floor(n*0.9))].i;

  series = sims.map((s, i) => ({
    label:       matchRuns[i].seed.replace("seed_","#"),
    color:       (i===p10i||i===p90i) ? condColor(cond) : GREY_LINE,
    frames:      s.frames,
    providers:   s.providers,
    lineWidth:   (i===p10i||i===p90i) ? 1.8 : 0.9,
    lineOpacity: (i===p10i||i===p90i) ? 0.85 : 1,
    isP10: i===p10i,
    isP90: i===p90i,
  }));

  // Compute variance bands
  varBands = METRICS.map(m => {
    return Array.from({length: nRounds}, (_,r) => {
      const vals = sims.map(s => m.fn(s.frames[r], s.providers)).sort((a,b)=>a-b);
      const pick = q => vals[Math.max(0,Math.min(n-1,Math.floor(n*q)))];
      return { p10:pick(0.1), median:pick(0.5), p90:pick(0.9) };
    });
  });

  pageTitle  = fmtCond(cond);
  pageSub    = `${isHeur ? "Heuristic" : modelLabel(model)} · ${n} seeds · variance`;

  // Meta bar chips
  const metaBar = document.getElementById("meta-bar");
  const chip = document.createElement("div");
  chip.className = "meta-chip";
  chip.style.cssText = `color:${condColor(cond)};border-color:${condColor(cond)};background:${condColor(cond)}18`;
  chip.textContent = fmtCond(cond);
  metaBar.appendChild(chip);
  const info = document.createElement("div");
  info.className = "meta-info";
  info.textContent = `${isHeur ? "Heuristic" : modelLabel(model)} · ${n} seeds · p10/p90 highlighted`;
  metaBar.appendChild(info);

} else {
  // mode = "across"
  const condStr = params.get("conditions") || "baseline";
  const conds   = condStr.split("|").filter(Boolean);
  const seed    = params.get("seed")  || "seed_42";
  const model   = params.get("model") || "claude-sonnet-4-6";

  const matchRuns = conds.map(c =>
    runsIndex.find(r => r.condition===c && r.seed===seed && r.model===model)
  ).filter(Boolean);

  if (!matchRuns.length) {
    document.getElementById("loading-msg").textContent = "No matching runs found.";
    throw new Error("no runs");
  }

  document.getElementById("loading-msg").textContent =
    `Loading ${matchRuns.length} runs…`;

  const sims = await Promise.all(
    matchRuns.map(r => fetch("data/"+r.path+"/frames.json").then(res => res.json()))
  );

  nRounds = sims[0].frames.length;

  series = sims.map((s, i) => ({
    label:       fmtCond(matchRuns[i].condition),
    color:       condColor(matchRuns[i].condition),
    frames:      s.frames,
    providers:   s.providers,
    lineWidth:   2,
    lineOpacity: 1,
    isHighlight: true,
  }));

  pageTitle = "Condition Comparison";
  pageSub   = `${modelLabel(model)} · ${seed.replace("seed_","seed ")} · ${matchRuns.length} conditions`;

  // Meta bar chips
  const metaBar = document.getElementById("meta-bar");
  matchRuns.forEach(r => {
    const chip = document.createElement("div");
    chip.className = "meta-chip";
    const col = condColor(r.condition);
    chip.style.cssText = `color:${col};border-color:${col};background:${col}18`;
    chip.textContent = fmtCond(r.condition);
    metaBar.appendChild(chip);
  });
  const info = document.createElement("div");
  info.className = "meta-info";
  info.textContent = `${modelLabel(model)} · ${seed.replace("seed_","seed ")}`;
  metaBar.appendChild(info);
}

/* ---- Update page heading ---- */
document.getElementById("hdr-title").textContent = pageTitle;
document.getElementById("hdr-sub").textContent   = pageSub;
document.getElementById("loading-msg").classList.add("hidden");
document.getElementById("charts-wrap").classList.remove("hidden");
document.getElementById("scrubber-wrap").classList.remove("hidden");
document.getElementById("anno-bar").classList.remove("hidden");
document.getElementById("scrubber").max = nRounds - 1;

/* ---- Build charts ---- */
let currentRound = 0;
const chartContexts = []; // {svg, x, y, nowEl, annoEls}

METRICS.forEach((metric, mi) => {
  const svgEl = document.getElementById("svg-" + metric.id);
  const W     = svgEl.parentElement.clientWidth || 900;
  svgEl.setAttribute("width", W);

  const cx   = W - MARGIN.left - MARGIN.right;
  const cy   = PANEL_H - MARGIN.top - MARGIN.bottom;
  const showX = mi === METRICS.length - 1;

  // Compute y domain
  let yMin = Infinity, yMax = -Infinity;
  series.forEach(s => {
    s.frames.forEach(f => {
      const v = metric.fn(f, s.providers);
      if (v < yMin) yMin = v;
      if (v > yMax) yMax = v;
    });
  });
  if (varBands) {
    varBands[mi].forEach(b => { if (b.p10 < yMin) yMin = b.p10; if (b.p90 > yMax) yMax = b.p90; });
  }
  const pad  = (yMax - yMin) * 0.08 || 0.02;
  const dom  = metric.domain || [Math.max(0, yMin - pad), yMax + pad];

  const x = d3.scaleLinear().domain([0, nRounds-1]).range([MARGIN.left, MARGIN.left+cx]);
  const y = d3.scaleLinear().domain(dom).range([MARGIN.top+cy, MARGIN.top]).clamp(true);

  const svg = d3.select(svgEl);

  // P10-P90 band (variance mode)
  if (varBands) {
    const color = condColor(params.get("condition") || "baseline");
    svg.append("path").attr("class","band")
      .datum(varBands[mi])
      .attr("fill", color + "22")
      .attr("d", d3.area()
        .x((_,i) => x(i))
        .y0(d => y(d.p10))
        .y1(d => y(d.p90))
      );
  }

  // Series lines
  series.forEach(s => {
    const vals = s.frames.map(f => metric.fn(f, s.providers));
    svg.append("path").attr("class","sline")
      .datum(vals)
      .attr("fill","none")
      .attr("stroke", s.color)
      .attr("stroke-width", s.lineWidth)
      .attr("opacity", s.lineOpacity)
      .attr("d", d3.line().x((_,i) => x(i)).y(v => y(v)).curve(d3.curveCatmullRom.alpha(0.5)));
  });

  // Axes
  const xAxis = d3.axisBottom(x).ticks(Math.min(nRounds, 8)).tickSize(0).tickPadding(4);
  const yAxis = d3.axisLeft(y).ticks(4).tickSize(-(cx)).tickPadding(4).tickFormat(metric.fmt);
  svg.append("g").attr("class","axis")
    .attr("transform",`translate(0,${MARGIN.top+cy})`)
    .call(showX ? xAxis : d3.axisBottom(x).ticks(0).tickSize(0))
    .call(a => a.select(".domain").attr("stroke","#c8b498"));
  svg.append("g").attr("class","axis")
    .attr("transform",`translate(${MARGIN.left},0)`)
    .call(yAxis)
    .call(a => a.select(".domain").remove())
    .call(a => a.selectAll(".tick line").attr("stroke","#d8c9b0").attr("stroke-dasharray","2,3"));

  // Now-line
  const nowEl = svg.append("line").attr("class","now-line")
    .attr("y1", MARGIN.top).attr("y2", MARGIN.top+cy)
    .attr("stroke","#2a1a0e").attr("stroke-width",1).attr("stroke-dasharray","3,2")
    .attr("x1", x(0)).attr("x2", x(0));

  // Annotation text labels (right of now-line)
  const annoEls = [];
  if (mode === "across") {
    series.forEach((s) => {
      if (mode === "variance" && !s.isP10 && !s.isP90) return;
      const el = svg.append("text").attr("class","anno-lbl")
        .attr("fill", mode==="variance" ? condColor(params.get("condition")||"baseline") : s.color)
        .attr("font-size", 9).attr("dominant-baseline","middle");
      const tag = mode==="variance" ? (s.isP10 ? "p10" : "p90") : s.label;
      annoEls.push({ el, s, tag });
    });
  }

  // Variance summary labels (p10/median/p90 values)
  const varAnnoEls = [];
  if (varBands) {
    ["p10","median","p90"].forEach(key => {
      const el = svg.append("text").attr("class","anno-lbl")
        .attr("fill", condColor(params.get("condition")||"baseline"))
        .attr("font-size",8.5).attr("dominant-baseline","middle").attr("opacity",0.75);
      varAnnoEls.push({el, key});
    });
  }

  chartContexts.push({ svg, x, y, nowEl, annoEls, varAnnoEls, metric, mi, cx, cy });
});

/* ---- Annotation bar items ---- */
const annoBar = document.getElementById("anno-bar");
const annoRows = series.map(s => {
  const row = document.createElement("div"); row.className = "anno-row";
  const sw  = document.createElement("div"); sw.className = "anno-swatch";
  sw.style.background = s.color; row.appendChild(sw);
  const lbl = document.createElement("div"); lbl.className = "anno-label";
  lbl.textContent = s.label; row.appendChild(lbl);
  const vals = document.createElement("div"); vals.className = "anno-vals";
  const valEls = METRICS.map(m => {
    const cell = document.createElement("div"); cell.className = "anno-val";
    const key  = document.createElement("div"); key.className = "anno-val-key"; key.textContent = m.label.split(" ")[0];
    const num  = document.createElement("div"); num.className = "anno-val-num";
    cell.appendChild(key); cell.appendChild(num);
    vals.appendChild(cell);
    return num;
  });
  row.appendChild(vals);
  annoBar.appendChild(row);
  return { valEls, s };
});

/* ---- Update function ---- */
function update(r) {
  currentRound = r;
  document.getElementById("round-lbl").textContent = `Round ${r}`;
  document.getElementById("scrubber").value = r;

  chartContexts.forEach(({x, y, nowEl, annoEls, varAnnoEls, metric, mi}) => {
    const nx = x(r);
    nowEl.attr("x1", nx).attr("x2", nx);

    if (annoEls.length) {
      const pts = annoEls.map(({el, s, tag}) => {
        const v = metric.fn(s.frames[r], s.providers);
        return { el, tag, v, y: y(v) };
      });
      pts.sort((a,b) => a.y - b.y);
      let lastY = -999;
      pts.forEach(pt => {
        let ry = pt.y;
        if (ry - lastY < 11) ry = lastY + 11;
        lastY = ry;
        pt.el.attr("x", nx + 6).attr("y", ry)
          .text(`${pt.tag}  ${metric.fmt(pt.v)}`);
      });
    }

    if (varAnnoEls.length && varBands) {
      const b = varBands[mi][r];
      const pts = varAnnoEls.map(({el,key},i) => ({ el, lbl: VAR_ANNO_KEYS[i].lbl, v: b[key] }));
      pts.sort((a,b)=>y(a.v)-y(b.v));
      let lastY = -999;
      pts.forEach(pt => {
        let ry = y(pt.v);
        if (ry - lastY < 10) ry = lastY + 10;
        lastY = ry;
        pt.el.attr("x", nx+6).attr("y", ry)
          .text(`${pt.lbl} ${metric.fmt(pt.v)}`);
      });
    }
  });

  // Update annotation bar
  annoRows.forEach(({valEls, s}) => {
    METRICS.forEach((m, mi) => {
      valEls[mi].textContent = m.fmt(m.fn(s.frames[r], s.providers));
    });
  });
}

/* ---- Scrubber controls ---- */
document.getElementById("scrubber").addEventListener("input", e => update(+e.target.value));
document.getElementById("btn-prev").addEventListener("click", () => update(Math.max(0, currentRound-1)));
document.getElementById("btn-next").addEventListener("click", () => update(Math.min(nRounds-1, currentRound+1)));

// Keyboard
document.addEventListener("keydown", e => {
  if (e.key==="ArrowLeft")  update(Math.max(0, currentRound-1));
  if (e.key==="ArrowRight") update(Math.min(nRounds-1, currentRound+1));
});

// Click-on-chart to jump
chartContexts.forEach(({svg, x}) => {
  svg.on("click", function(event) {
    const [mx] = d3.pointer(event);
    const r = Math.round(x.invert(mx));
    if (r >= 0 && r < nRounds) update(r);
  }).style("cursor","crosshair");
});

update(0);
</script>
</body>
</html>
